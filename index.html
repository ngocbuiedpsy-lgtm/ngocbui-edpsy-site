<!-- If content.js has a typo it cannot load at all, and the page would other-
     wise go silently blank. This shows what is wrong instead. -->
<script>
(function () {
  if (typeof CONTENT !== "undefined") return;
  var d = document.createElement("div");
  d.setAttribute("style",
    "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;" +
    "justify-content:center;background:#FDF8F3;padding:2rem;" +
    "font-family:system-ui,sans-serif;color:#33303F");
  d.innerHTML =
    '<div style="max-width:34rem;line-height:1.6">' +
    '<h1 style="font-size:1.4rem;margin:0 0 .8rem">content.js has a typo</h1>' +
    '<p style="margin:0 0 .8rem">The page is blank because the content file could not be read. ' +
    'It is almost always one of these, in the line you edited last:</p>' +
    '<ul style="margin:0 0 .8rem;padding-left:1.2rem">' +
    '<li>a straight double quote <b>"</b> inside the text (use the curly ' +
    '<b>&ldquo; &rdquo;</b> instead, or put a backslash before it)</li>' +
    '<li>a missing comma at the end of a line</li>' +
    '<li>a deleted quote mark or brace</li></ul>' +
    '<p style="margin:0">Press <b>F12</b> and open <b>Console</b>: the red message names the exact line.</p>' +
    '</div>';
  document.body.appendChild(d);
})();
</script>
